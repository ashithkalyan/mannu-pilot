<!doctype html>
<html lang="kn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mannu · ಮಣ್ಣು</title><meta name="theme-color" content="#137333"><link rel="manifest" href="manifest.json">
<style>
:root{--g:#137333;--b:#1967d2;--r:#c5221f;--y:#fbbc04;--bg:#f6f8f6;--tx:#202124;--mut:#5f6368;--bd:#dadce0}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 "Noto Sans Kannada","Nirmala UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:40px}
header{background:var(--g);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:22px;margin:0;flex:1}header small{display:block;font-weight:400;font-size:13px;opacity:.9}
.badge{font-size:12px;background:#fff3;border-radius:10px;padding:2px 8px}
main{max-width:640px;margin:0 auto;padding:12px}
section{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
h2{font-size:17px;margin:0 0 10px;color:var(--g)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 0;min-width:90px}
button,.btn,select,input{font:inherit;min-height:48px;border-radius:12px;border:1.5px solid var(--bd);padding:8px 12px;background:#fff;color:var(--tx)}
button,.btn{cursor:pointer;text-align:center;display:inline-flex;align-items:center;justify-content:center}
.sel{border-color:var(--g);background:#e6f4ea;font-weight:700}
.primary{background:var(--g);color:#fff;border:0;width:100%;font-size:20px;font-weight:700;min-height:56px}
.sec{background:var(--b);color:#fff;border:0}.mut{color:var(--mut);font-size:14px}.warn{background:#fef7e0;border:1px solid #f0d27a;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:15px}
.err{background:#fce8e6;border-color:#f3b4ae}label{display:block;font-size:15px;color:var(--mut);margin:8px 0 4px}
.n3{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}.n3 b{grid-column:1/-1;margin-top:6px}
.step{border-left:5px solid var(--g);padding:6px 10px;margin:10px 0;background:#f8fbf8;border-radius:8px}.step h3{margin:0 0 6px;font-size:16px}
.prods{display:flex;gap:10px;flex-wrap:wrap}.p{text-align:center;min-width:92px}.p .icons{min-height:40px}.p b{display:block;font-size:15px}.p span{font-size:15px}
.bag{margin:0 1px}.tot{font-weight:700;font-size:18px}pre{white-space:pre-wrap;font:15px/1.5 inherit;background:#f1f3f4;border-radius:10px;padding:10px;margin:8px 0}
.good{color:var(--g);font-weight:700}.bad{color:var(--r);font-weight:700}
</style></head>
<body><header><h1 id="appname">Mannu<small id="tag"></small></h1><span class="badge" id="net"></span><button id="langBtn" data-act="lang" style="min-height:40px">EN</button></header>
<main id="app"></main>
<script type="module" src="app.mjs"></script>
</body></html>
